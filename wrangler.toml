name = "lightanime-api"
main = "index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 4000

[vars]
API_VERSION = "2.3"
CACHE_ENABLED = "false"
DEFAULT_REDIS_TTL = "900"

# Optional Cloudflare KV namespace binding for edge caching:
# [[kv_namespaces]]
# binding = "CACHE_KV"
# id = "<YOUR_KV_NAMESPACE_ID>"
